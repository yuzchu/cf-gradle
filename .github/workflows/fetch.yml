name: Fetch Gradle (add missing)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch specific versions
        run: |
          for V in 9.8.1; do
            TAG="gradle-${V}"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "skip $TAG"; continue; fi
            curl -sL -o g.zip "https://services.gradle.org/distributions/gradle-${V}-bin.zip"
            gh release create "$TAG" g.zip --repo "$GITHUB_REPOSITORY" --title "Gradle ${V}" --notes "Gradle ${V} bin"
            rm -f g.zip
          done
        env:
          GH_TOKEN: ${{ github.token }}
