name: Fetch Gradle
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Gradle 7.0+ (each line's latest)
        run: |
          # 动态生成版本清单: 7.0+ 正式版, 小版本只留每条线最新
          curl -s https://services.gradle.org/versions/all -o versions.json
          python3 - <<'PY' > verlist.txt
          import json
          d = json.load(open('versions.json'))
          rel = [v['version'] for v in d if not v.get('snapshot') and not v.get('rcFor') and not v.get('milestoneFor') and not v.get('broken')]
          def key(v):
              parts = v.split('.')
              return tuple(int(p) for p in parts[:3] if p.isdigit()) + (0,)*(3-len([p for p in parts[:3] if p.isdigit()]))
          majors = {}
          for v in rel:
              k = key(v)[:2]  # major.minor
              if k not in majors or key(v) > key(majors[k]):
                  majors[k] = v
          sel = sorted(majors.values(), key=key)
          sel = [v for v in sel if key(v) >= (7,0,0)]
          print('\n'.join(sel))
          PY
          echo "将抓取以下版本:"; cat verlist.txt; echo "共 $(wc -l < verlist.txt) 个"
          mkdir -p dist
          i=0
          while read V; do
            TAG="gradle-${V}"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "skip $TAG (已存在)"; continue
            fi
            F="gradle-${V}-bin.zip"
            curl -sL -o "$F" "https://services.gradle.org/distributions/gradle-${V}-bin.zip"
            echo "$F: $(du -m $F | cut -f1)MB"
            gh release create "$TAG" "$F" --repo "$GITHUB_REPOSITORY" --title "Gradle ${V}" --notes "Gradle ${V} bin distribution"
            rm -f "$F"
            i=$((i+1))
            [ $i -ge 10 ] && break   # 单次最多 10 个, 防超时; 多跑几次补齐
          done < verlist.txt
        env:
          GH_TOKEN: ${{ github.token }}
